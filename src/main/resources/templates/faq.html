<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Контакты поддержки</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Help Desk</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">Главная</a>
            <a class="nav-link active" th:href="@{/about}">О нас</a>
            <a class="nav-link" th:href="@{/contacts}">Контакты</a>
            <a class="nav-link" th:href="@{/tickets/new}">Создать заявку</a>
            <a class="nav-link" th:href="@{/admin/tickets}">Админ-панель</a>
            <a class="nav-link" th:href="@{/faq}">FAQ</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <h1 class="fw-bold mb-4" th:text="${pageTitle}">
        Контакты поддержки
    </h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped align-middle mb-0">
                <tbody>
                <h1>Частые вопросы</h1>

                <ul>
                    <li>
                        <strong>Как связаться с поддержкой?</strong><br>
                        Создать заявкую
                    </li>
                    <li>
                        <strong>Сколько времени рассматривается обращение?</strong><br>
                        Обычно в течение 1–2 рабочих дней.
                    </li>
                </ul>

                </tbody>
            </table>
        </div>
    </div>

    <a class="btn btn-outline-primary" th:href="@{/}">
        Вернуться на главную
    </a>
</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
